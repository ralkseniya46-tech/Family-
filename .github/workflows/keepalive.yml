name: Keep family planner responsive
on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Warm Render bot (public health endpoint only)
        run: |
          curl --location --fail-with-body --silent --show-error --max-time 120 --retry 2 --retry-delay 5 'https://family-planner-telegram.onrender.com/health'
