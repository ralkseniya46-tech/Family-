name: Record monitor maintenance activity
on:
  schedule:
    - cron: '41 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Record monthly monitor upkeep
        run: |
          printf 'Monitor upkeep: %s UTC\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > monitor-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor-heartbeat.txt
          git commit -m 'Record monthly uptime monitor upkeep'
          git push
